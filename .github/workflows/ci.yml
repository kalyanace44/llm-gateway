name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check prism/ tests/
      - name: Test
        run: pytest tests/ -v --tb=short

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Add repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
      - name: Build dependencies
        run: helm dependency build deploy/helm/prism/
      - name: Lint
        run: helm lint deploy/helm/prism/
      - name: Template
        run: helm template prism deploy/helm/prism/ --set secrets.openaiApiKey=test --set secrets.anthropicApiKey=test > /dev/null
