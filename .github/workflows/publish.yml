name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # Trusted publishing (no API token needed)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v
      - name: Lint
        run: ruff check prism/ tests/

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing — configure at pypi.org/manage/project/prism-gateway/settings/publishing/
        # No PYPI_API_TOKEN secret needed after setup

  helm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Add dependency repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
      - name: Build Helm dependencies
        run: helm dependency build deploy/helm/prism/
      - name: Package Helm chart
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          helm package deploy/helm/prism/ --version "$VERSION" --app-version "$VERSION" -d docs/charts/
      - name: Update Helm repo index
        run: helm repo index docs/charts/ --url https://kalyanace44.github.io/llm-gateway/charts --merge docs/charts/index.yaml
      - name: Commit and push Helm chart
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "release: Helm chart ${GITHUB_REF_NAME}"
          file_pattern: docs/charts/*

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kalyanace44/prism-gateway:${{ steps.meta.outputs.version }}
            ghcr.io/kalyanace44/prism-gateway:latest
