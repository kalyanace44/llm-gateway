[project]
name = "prism-gateway"
version = "0.1.0"
description = "Prism — AI Traffic Control Plane. Route, protect, optimize, observe."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "Kalyan", email = "kalyanace44@users.noreply.github.com"}]
keywords = ["llm", "gateway", "ai", "proxy", "openai", "anthropic", "routing", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "tiktoken>=0.8.0",
    "numpy>=1.26.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "sse-starlette>=2.2.0",
]

[project.urls]
Homepage = "https://kalyanace44.github.io/llm-gateway/"
Repository = "https://github.com/kalyanace44/llm-gateway"
Issues = "https://github.com/kalyanace44/llm-gateway/issues"
Documentation = "https://kalyanace44.github.io/llm-gateway/"
"Helm Chart" = "https://kalyanace44.github.io/llm-gateway/charts"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
# Legacy gateway modules (Phase 1-5)
legacy = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
prism = "prism.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*", "gateway*"]
