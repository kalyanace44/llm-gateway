# ─── Prism AI Traffic Control Plane ───────────────────────────────
# helm install prism ./deploy/helm/prism -f values.yaml
# ONE FILE controls your entire deployment.

# ─── Gateway ─────────────────────────────────────────────────────
gateway:
  replicaCount: 2
  image:
    repository: ghcr.io/kalyanace44/prism-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPU: 70
  port: 8000
  env:
    LOG_LEVEL: "info"

# ─── Prism Config (mounted as /etc/prism/prism.yaml) ─────────────
config:
  backends:
    - name: openai
      provider: openai
      base_url: "https://api.openai.com/v1"
      models: ["gpt-4o", "gpt-4o-mini"]
      max_concurrent: 50
      timeout: 120
      weight: 1.0
      priority: 10

    - name: anthropic
      provider: anthropic
      base_url: "https://api.anthropic.com/v1"
      models: ["claude-sonnet-4-20250514", "claude-haiku-3"]
      max_concurrent: 50
      timeout: 120
      weight: 0.8
      priority: 5

  rate_limits:
    requests_per_minute: 120
    tokens_per_minute: 500000
    burst_multiplier: 2.0

  costs:
    - model: "gpt-4o"
      input_cost_per_1k: 0.005
      output_cost_per_1k: 0.015
    - model: "gpt-4o-mini"
      input_cost_per_1k: 0.00015
      output_cost_per_1k: 0.0006
    - model: "claude-sonnet-4-20250514"
      input_cost_per_1k: 0.003
      output_cost_per_1k: 0.015

  default_model: "gpt-4o-mini"
  fallback_chain: [openai, anthropic]
  cache_enabled: true
  cache_ttl: 3600

  # PII Scanner (fintech compliance)
  scanner:
    enabled: true
    action: block          # block | redact | log
    rules:
      - name: pan_card
        pattern: '[A-Z]{5}[0-9]{4}[A-Z]'
      - name: aadhaar
        pattern: '\b\d{4}\s\d{4}\s\d{4}\b'
      - name: credit_card
        pattern: '\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b'

# ─── Secrets (API keys — set via --set or external secret) ───────
secrets:
  openaiApiKey: ""         # --set secrets.openaiApiKey=sk-...
  anthropicApiKey: ""      # --set secrets.anthropicApiKey=sk-ant-...
  adminKey: "admin-secret" # Gateway admin key

# ─── Redis (cache + rate limiting) ───────────────────────────────
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: true
    size: 1Gi
  maxmemory: "256mb"

# ─── Prometheus (metrics scraping) ───────────────────────────────
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: "latest"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
  scrapeInterval: 15s

# ─── Grafana (dashboards) ────────────────────────────────────────
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "latest"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  adminPassword: "admin"
  persistence:
    enabled: true
    size: 1Gi

# ─── Ingress ─────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  host: prism.yourdomain.com
  tls:
    enabled: false
    secretName: prism-tls

# ─── Service ─────────────────────────────────────────────────────
service:
  type: ClusterIP          # ClusterIP | LoadBalancer | NodePort
  port: 8000
