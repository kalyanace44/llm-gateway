# ═══════════════════════════════════════════════════════════════════
# Prism — AI Traffic Control Plane
# ═══════════════════════════════════════════════════════════════════
# helm install prism ./deploy/helm/prism \
#   --set secrets.openaiApiKey=sk-... \
#   --set secrets.anthropicApiKey=sk-ant-...
# ═══════════════════════════════════════════════════════════════════

# ─── Gateway (our code — only thing we template ourselves) ────────
gateway:
  replicaCount: 2
  image:
    repository: ghcr.io/kalyanace44/prism-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPU: 70
  port: 8000
  env:
    LOG_LEVEL: "info"

# ─── Prism Config (mounted as /etc/prism/prism.yaml) ─────────────
config:
  backends:
    - name: openai
      provider: openai
      base_url: "https://api.openai.com/v1"
      models: ["gpt-4o", "gpt-4o-mini"]
      max_concurrent: 50
      timeout: 120
      weight: 1.0
      priority: 10

    - name: anthropic
      provider: anthropic
      base_url: "https://api.anthropic.com/v1"
      models: ["claude-sonnet-4-20250514", "claude-haiku-3"]
      max_concurrent: 50
      timeout: 120
      weight: 0.8
      priority: 5

  rate_limits:
    requests_per_minute: 120
    tokens_per_minute: 500000
    burst_multiplier: 2.0

  costs:
    - model: "gpt-4o"
      input_cost_per_1k: 0.005
      output_cost_per_1k: 0.015
    - model: "gpt-4o-mini"
      input_cost_per_1k: 0.00015
      output_cost_per_1k: 0.0006
    - model: "claude-sonnet-4-20250514"
      input_cost_per_1k: 0.003
      output_cost_per_1k: 0.015

  default_model: "gpt-4o-mini"
  fallback_chain: [openai, anthropic]
  cache_enabled: true
  cache_ttl: 3600

  # PII Scanner (RBI compliance)
  scanner:
    enabled: true
    action: block
    rules:
      - name: pan_card
        pattern: '[A-Z]{5}[0-9]{4}[A-Z]'
      - name: aadhaar
        pattern: '\b\d{4}\s\d{4}\s\d{4}\b'
      - name: credit_card
        pattern: '\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b'

# ─── Secrets ─────────────────────────────────────────────────────
secrets:
  openaiApiKey: ""
  anthropicApiKey: ""
  adminKey: "admin-secret"

# ─── Ingress ─────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  host: prism.yourdomain.com
  tls:
    enabled: false
    secretName: prism-tls

# ─── Service ─────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8000

# ═══════════════════════════════════════════════════════════════════
# SUB-CHART CONFIGURATION
# These configure official community Helm charts pulled as dependencies.
# Same pattern as kube-prometheus-stack, cert-manager, istio.
# ═══════════════════════════════════════════════════════════════════

# ─── Redis (Bitnami) ─────────────────────────────────────────────
# https://github.com/bitnami/charts/tree/main/bitnami/redis
redis:
  enabled: true
  architecture: standalone       # standalone | replication
  auth:
    enabled: false               # No password for dev; enable in prod
  master:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    persistence:
      enabled: true
      size: 1Gi
  # Override the generated Redis URL in gateway env
  # Gateway connects to: redis://prism-redis-master:6379

# ─── Grafana (Official) ──────────────────────────────────────────
# https://github.com/grafana/helm-charts/tree/main/charts/grafana
grafana:
  enabled: true
  adminPassword: admin
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prism-prometheus-server:80
          access: proxy
          isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          folder: Prism
          type: file
          options:
            path: /var/lib/grafana/dashboards/default

# ─── Prometheus (Community) ───────────────────────────────────────
# https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus
prometheus:
  enabled: true
  server:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistentVolume:
      enabled: true
      size: 5Gi
    global:
      scrape_interval: 15s
  # Scrape the Prism gateway /metrics endpoint
  extraScrapeConfigs: |
    - job_name: prism-gateway
      static_configs:
        - targets: ["prism-prism:8000"]
      metrics_path: /metrics
  # Disable components we don't need
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
