apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prism.fullname" . }}-secrets
  labels:
    {{- include "prism.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  ADMIN_KEY: {{ .Values.secrets.adminKey | quote }}
