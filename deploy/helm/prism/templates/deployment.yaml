apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prism.fullname" . }}
  labels:
    {{- include "prism.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "prism.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "prism.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          env:
            - name: PRISM_CONFIG_PATH
              value: /etc/prism/prism.yaml
            - name: PRISM_PORT
              value: {{ .Values.gateway.port | quote }}
            - name: PRISM_LOG_LEVEL
              value: {{ .Values.gateway.env.LOG_LEVEL }}
            - name: REDIS_URL
              value: redis://{{ .Release.Name }}-redis-master:6379
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism.fullname" . }}-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism.fullname" . }}-secrets
                  key: ANTHROPIC_API_KEY
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism.fullname" . }}-secrets
                  key: ADMIN_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/prism
              readOnly: true
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "prism.fullname" . }}-config
