<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism — Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0e17;
  --surface: #111827;
  --surface2: #1a2332;
  --border: #1e293b;
  --text: #e2e8f0;
  --muted: #64748b;
  --accent: #6366f1;
  --green: #10b981;
  --orange: #f59e0b;
  --red: #ef4444;
  --cyan: #06b6d4;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Header */
.header { padding: 16px 32px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; font-weight: 700; }
.header h1 span { color: var(--accent); }
.header .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; padding: 24px 32px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.card-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.card-value { font-size: 28px; font-weight: 700; }
.card-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* Sections */
.section { padding: 0 32px 24px; }
.section-title { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

/* Provider cards */
.providers { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.provider-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; align-items: center; gap: 12px; }
.provider-status { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.provider-status.closed { background: var(--green); }
.provider-status.half_open { background: var(--orange); }
.provider-status.open { background: var(--red); }
.provider-info { flex: 1; }
.provider-name { font-size: 14px; font-weight: 600; }
.provider-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.provider-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
.provider-badge.closed { background: rgba(16,185,129,0.15); color: var(--green); }
.provider-badge.half_open { background: rgba(245,158,11,0.15); color: var(--orange); }
.provider-badge.open { background: rgba(239,68,68,0.15); color: var(--red); }

/* Tables */
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
th, td { padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
th { background: var(--surface2); color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
td { color: var(--text); }

/* Bar chart (CSS-only) */
.bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.bar-label { width: 100px; font-size: 12px; color: var(--muted); text-align: right; }
.bar-track { flex: 1; height: 24px; background: var(--surface2); border-radius: 4px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 600; color: white; }
.bar-fill.model-0 { background: var(--accent); }
.bar-fill.model-1 { background: var(--cyan); }
.bar-fill.model-2 { background: var(--green); }
.bar-fill.model-3 { background: var(--orange); }
.bar-fill.model-4 { background: var(--red); }

/* Two-col layout */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

/* Refresh indicator */
.refresh { font-size: 11px; color: var(--muted); padding: 8px 32px; text-align: right; }

/* Error state */
.error-banner { background: rgba(239,68,68,0.1); border: 1px solid var(--red); color: var(--red); padding: 12px 32px; font-size: 13px; display: none; }
</style>
</head>
<body>

<header class="header">
  <h1><span>▲</span> Prism Dashboard</h1>
  <div class="status">
    <div class="dot" id="live-dot"></div>
    <span id="status-text">Connecting...</span>
  </div>
</header>

<div class="error-banner" id="error-banner"></div>

<!-- KPI Cards -->
<div class="grid" id="kpi-grid">
  <div class="card">
    <div class="card-title">Total Requests</div>
    <div class="card-value" id="kpi-requests">—</div>
    <div class="card-sub" id="kpi-errors-sub"></div>
  </div>
  <div class="card">
    <div class="card-title">Tokens Processed</div>
    <div class="card-value" id="kpi-tokens">—</div>
    <div class="card-sub" id="kpi-tokens-sub"></div>
  </div>
  <div class="card">
    <div class="card-title">Cache Hit Rate</div>
    <div class="card-value" id="kpi-cache">—</div>
    <div class="card-sub" id="kpi-cache-sub"></div>
  </div>
  <div class="card">
    <div class="card-title">Latency (p95)</div>
    <div class="card-value" id="kpi-latency">—</div>
    <div class="card-sub" id="kpi-latency-sub"></div>
  </div>
  <div class="card">
    <div class="card-title">Error Rate</div>
    <div class="card-value" id="kpi-error-rate">—</div>
    <div class="card-sub" id="kpi-error-rate-sub"></div>
  </div>
  <div class="card">
    <div class="card-title">Total Cost</div>
    <div class="card-value" id="kpi-cost">—</div>
    <div class="card-sub" id="kpi-cost-sub"></div>
  </div>
</div>

<!-- Providers -->
<div class="section">
  <div class="section-title">Provider Health</div>
  <div class="providers" id="providers-grid"></div>
</div>

<!-- Two column: models + teams -->
<div class="section">
  <div class="two-col">
    <div>
      <div class="section-title">Requests by Model</div>
      <div id="model-chart"></div>
    </div>
    <div>
      <div class="section-title">Cost by Team</div>
      <table id="team-table">
        <thead><tr><th>Team</th><th>Requests</th><th>Cost</th></tr></thead>
        <tbody id="team-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="refresh" id="refresh-text">Last updated: —</div>

<script>
const ADMIN_KEY = localStorage.getItem('prism_admin_key') || '';
const REFRESH_MS = 5000;

async function fetchStats() {
  try {
    const headers = {};
    if (ADMIN_KEY) headers['Authorization'] = `Bearer ${ADMIN_KEY}`;

    const resp = await fetch('/admin/stats', { headers });
    if (resp.status === 401 || resp.status === 403) {
      promptKey();
      return null;
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return await resp.json();
  } catch (e) {
    showError(`Failed to fetch stats: ${e.message}`);
    return null;
  }
}

function promptKey() {
  const key = prompt('Enter your Prism admin key:');
  if (key) {
    localStorage.setItem('prism_admin_key', key);
    location.reload();
  }
}

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('live-dot').style.background = 'var(--red)';
  document.getElementById('status-text').textContent = 'Disconnected';
}

function hideError() {
  document.getElementById('error-banner').style.display = 'none';
  document.getElementById('live-dot').style.background = 'var(--green)';
  document.getElementById('status-text').textContent = 'Live';
}

function formatNum(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return n.toLocaleString();
}

function updateDashboard(data) {
  hideError();
  const m = data.metrics;
  const c = data.cache;
  const p = data.providers;

  // KPIs
  document.getElementById('kpi-requests').textContent = formatNum(m.total_requests);
  document.getElementById('kpi-errors-sub').textContent = `${m.total_errors} errors`;
  document.getElementById('kpi-tokens').textContent = formatNum(m.total_tokens);
  document.getElementById('kpi-tokens-sub').textContent = `across all providers`;
  document.getElementById('kpi-cache').textContent = (m.cache_hit_rate * 100).toFixed(1) + '%';
  document.getElementById('kpi-cache-sub').textContent = `${m.total_cache_hits} hits`;
  document.getElementById('kpi-latency').textContent = m.latency_p95 + 's';
  document.getElementById('kpi-latency-sub').textContent = `p50: ${m.latency_p50}s / p99: ${m.latency_p99}s`;
  document.getElementById('kpi-error-rate').textContent = (m.error_rate * 100).toFixed(2) + '%';
  document.getElementById('kpi-error-rate-sub').textContent = m.error_rate > 0.05 ? '⚠️ Above threshold' : '✓ Healthy';

  const totalCost = Object.values(m.cost_by_team || {}).reduce((a, b) => a + b, 0);
  document.getElementById('kpi-cost').textContent = '$' + totalCost.toFixed(2);
  document.getElementById('kpi-cost-sub').textContent = `${Object.keys(m.cost_by_team || {}).length} teams tracked`;

  // Providers
  const provGrid = document.getElementById('providers-grid');
  let provHTML = '';
  for (const [name, info] of Object.entries(p || {})) {
    const state = info.state || 'closed';
    const failures = info.failure_count || 0;
    const requests = m.by_provider[name] || 0;
    provHTML += `
      <div class="provider-card">
        <div class="provider-status ${state}"></div>
        <div class="provider-info">
          <div class="provider-name">${name}</div>
          <div class="provider-meta">${formatNum(requests)} requests • ${failures} failures</div>
        </div>
        <span class="provider-badge ${state}">${state.replace('_', ' ')}</span>
      </div>`;
  }
  provGrid.innerHTML = provHTML || '<div style="color:var(--muted);font-size:13px;">No providers configured</div>';

  // Model chart
  const modelChart = document.getElementById('model-chart');
  const models = Object.entries(m.by_model || {}).sort((a, b) => b[1] - a[1]);
  const maxModel = models.length > 0 ? models[0][1] : 1;
  let chartHTML = '';
  models.slice(0, 6).forEach(([model, count], i) => {
    const pct = (count / maxModel * 100).toFixed(0);
    chartHTML += `
      <div class="bar-row">
        <div class="bar-label">${model}</div>
        <div class="bar-track">
          <div class="bar-fill model-${i % 5}" style="width:${pct}%">${formatNum(count)}</div>
        </div>
      </div>`;
  });
  modelChart.innerHTML = chartHTML || '<div style="color:var(--muted);font-size:13px;">No requests yet</div>';

  // Team table
  const teamTbody = document.getElementById('team-tbody');
  const teams = Object.entries(m.by_team || {}).sort((a, b) => b[1] - a[1]);
  let tableHTML = '';
  teams.forEach(([team, count]) => {
    const cost = (m.cost_by_team || {})[team] || 0;
    tableHTML += `<tr><td>${team}</td><td>${formatNum(count)}</td><td>$${cost.toFixed(4)}</td></tr>`;
  });
  teamTbody.innerHTML = tableHTML || '<tr><td colspan="3" style="color:var(--muted);">No teams yet</td></tr>';

  // Refresh time
  document.getElementById('refresh-text').textContent = `Last updated: ${new Date().toLocaleTimeString()} • Refreshes every ${REFRESH_MS/1000}s`;
}

async function tick() {
  const data = await fetchStats();
  if (data) updateDashboard(data);
}

// Start
tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
